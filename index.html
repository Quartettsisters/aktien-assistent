<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aktien">
<title>Aktien-Assistent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1419;--card:#18202a;--line:#27313d;--tx:#e8edf2;--mut:#8a97a6;--ok:#34c759;--warn:#ffb020;--bad:#ff5a5f;--acc:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
main{max-width:720px;margin:0 auto;padding:14px 14px 24px}
nav{position:fixed;bottom:0;left:0;right:0;background:#121922;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 2px;font-size:12px}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sym{font-weight:650}
.mut{color:var(--mut);font-size:13px}
.badge{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;border:1px solid}
.b-k{color:var(--ok);border-color:var(--ok)}.b-b{color:var(--warn);border-color:var(--warn)}.b-m{color:var(--bad);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid div{font-size:13px}.grid b{display:block;font-size:14px}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{border-color:var(--acc);color:var(--acc)}
input,select{width:100%;background:#0c1116;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
button.pri{width:100%;background:var(--acc);color:#04121f;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:650}
button.sec{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:13px}
button.del{border-color:var(--bad);color:var(--bad)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#2b3644;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
.login{max-width:380px;margin:12vh auto 0;padding:0 18px}
h2{font-size:16px;margin:18px 0 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:720px;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.modal svg{width:100%;height:auto;display:block;touch-action:none}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const SUPABASE_URL = "https://ehgkeyscqtcxsujktwrn.supabase.co";
const SUPABASE_KEY = "sb_publishable_etYhKUB4ZWXNCJhWJOXVSw_6fP7sCeK";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $app = document.getElementById("app");
const state = { tab: "signale", filter: "alle", q: "", sort: "score" };

// ---------- Helfer (alles ueber textContent, kein innerHTML) ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const fmt = (n, d = 2) => n == null ? "–" : Number(n).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 1) => n == null ? "–" : (n >= 0 ? "+" : "") + fmt(n * 100, d) + " %";
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 3500);
}
const badgeClass = (s) => s === "Kandidat" ? "b-k" : s === "meiden" ? "b-m" : "b-b";

// ---------- Login ----------
function renderLogin() {
  const email = h("input", { type: "email", autocomplete: "username", placeholder: "E-Mail" });
  const pw = h("input", { type: "password", autocomplete: "current-password", placeholder: "Passwort" });
  const go = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
    if (error) toast("Anmeldung fehlgeschlagen: " + error.message);
  };
  pw.addEventListener("keydown", (e) => e.key === "Enter" && go());
  $app.replaceChildren(h("div", { class: "login" },
    h("h1", {}, "Aktien-Assistent"),
    h("p", { class: "mut" }, "Bitte anmelden."),
    email, pw, h("button", { class: "pri", onclick: go }, "Anmelden")));
}

async function callScan(symbols) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Nicht angemeldet");
  const qs = symbols && symbols.length ? "?symbols=" + encodeURIComponent(symbols.join(",")) : "";
  const r = await fetch(SUPABASE_URL + "/functions/v1/scan" + qs, { headers: { Authorization: "Bearer " + session.access_token, apikey: SUPABASE_KEY } });
  if (!r.ok) throw new Error("Auswertung fehlgeschlagen (" + r.status + ")");
  return r.json();
}

// ---------- Daten ----------
async function loadSignals() {
  const { data, error } = await sb.from("signals").select("*").order("as_of", { ascending: false }).limit(600);
  if (error) throw error;
  const latest = new Map();
  for (const r of data) if (!latest.has(r.symbol)) latest.set(r.symbol, r);
  return latest;
}
async function loadNames() {
  const { data } = await sb.from("watchlist").select("symbol,name,active");
  return new Map((data || []).map((w) => [w.symbol, w.name || w.symbol]));
}

// ---------- Tabs ----------
async function tabSignale() {
  const [sig, names] = await Promise.all([loadSignals(), loadNames()]);
  const all = [...sig.values()];
  const count = (k) => all.filter((r) => r.signal === k).length;
  const sorters = {
    score: (a, b) => b.score - a.score || a.symbol.localeCompare(b.symbol),
    name: (a, b) => (names.get(a.symbol) || a.symbol).localeCompare(names.get(b.symbol) || b.symbol),
    mom: (a, b) => b.mom12 - a.mom12,
    nah: (a, b) => b.dist_high - a.dist_high,
    ruhig: (a, b) => a.vola - b.vola,
  };
  const q = (state.q || "").trim().toLowerCase();
  const list = all.filter((r) => (state.filter === "alle" || r.signal === state.filter) &&
    (!q || r.symbol.toLowerCase().includes(q) || (names.get(r.symbol) || "").toLowerCase().includes(q)))
    .sort(sorters[state.sort || "score"]);

  const chips = h("div", { class: "chips" }, ["alle", "Kandidat", "beobachten", "meiden"].map((f) =>
    h("button", { class: "chip" + (state.filter === f ? " on" : ""), onclick: () => { state.filter = f; render(); } },
      (f === "alle" ? "Alle" : f) + " " + (f === "alle" ? all.length : count(f)))));
  const search = h("input", { type: "search", placeholder: "Suchen (Name oder Symbol)", value: state.q || "", style: "margin:0" });
  search.addEventListener("input", () => { state.q = search.value; clearTimeout(search.t); search.t = setTimeout(async () => { await render(); const el = document.querySelector("input[type=search]"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 350); });
  const sortSel = h("select", { style: "margin:0" }, [["score", "Sortieren: Score"], ["name", "Sortieren: Name"], ["mom", "Sortieren: 12-Monats-Entwicklung"], ["nah", "Sortieren: nah am Hoch"], ["ruhig", "Sortieren: wenig Schwankung"]].map(([v, t]) => h("option", { value: v, selected: (state.sort || "score") === v }, t)));
  sortSel.addEventListener("change", () => { state.sort = sortSel.value; render(); });
  const refresh = h("button", { class: "sec", onclick: async (e) => {
    e.target.disabled = true; e.target.textContent = "Aktualisiert …";
    try { const r = await callScan(); const err = Object.keys(r.errors || {}).length; toast(r.analysed + " Werte aktualisiert" + (err ? ", " + err + " mit Fehler" : "")); }
    catch (x) { toast("Fehler: " + x.message); }
    render();
  } }, "Jetzt aktualisieren");

  const asOf = all.map((r) => r.as_of).sort().pop();
  const { data: heldRows } = await sb.from("holdings").select("symbol");
  const heldSet = new Set((heldRows || []).map((x) => x.symbol));
  const top = all.filter((r) => r.signal === "Kandidat" && !heldSet.has(r.symbol))
    .sort((a, b) => b.score - a.score || a.vola - b.vola).slice(0, 5);
  const out = [
    h("div", { class: "card" },
      h("div", { class: "row" }, h("b", {}, all.length + " Werte beobachtet"), refresh),
      h("div", { class: "grid" },
        h("div", {}, "Kandidaten", h("b", { class: "pos" }, count("Kandidat"))),
        h("div", {}, "Beobachten", h("b", { style: "color:var(--warn)" }, count("beobachten"))),
        h("div", {}, "Meiden", h("b", { class: "neg" }, count("meiden")))),
      asOf ? h("p", { class: "mut", style: "margin:8px 0 0" }, "Stand Börsenschluss: " + new Date(asOf).toLocaleDateString("de-DE")) : null),
    top.length ? h("div", { class: "card" },
      h("b", {}, "Top " + top.length + " für dein Depot"),
      h("p", { class: "mut", style: "margin:4px 0 8px" }, "Höchster Score, bei Gleichstand die ruhigere Aktie. Ohne bereits gehaltene Werte."),
      ...top.map((r, i) => h("div", { class: "row", style: "cursor:pointer;padding:6px 0;border-top:1px solid var(--line, #2a2f3a)", onclick: () => openChart(r.symbol, names.get(r.symbol) || r.symbol, r.stop_price) },
        h("div", {}, h("b", {}, (i + 1) + ". " + (names.get(r.symbol) || r.symbol)), " ", h("span", { class: "mut" }, "Score " + r.score + " · Schwankung " + fmt(r.vola * 100, 0) + " %")),
        h("span", {}, "ca. " + fmt(r.size_eur) + " €")))) : null,
    h("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px" }, search, sortSel),
    chips,
    list.length ? h("p", { class: "mut" }, list.length + " Treffer. Tippe auf eine Aktie für den Kursverlauf.") : null,
  ];
  if (!list.length) out.push(h("p", { class: "mut" }, all.length ? "Keine Treffer." : "Noch keine Daten. Die Auswertung läuft werktags nach Börsenschluss, oder tippe auf Jetzt aktualisieren."));
  for (const r of list) {
    out.push(h("div", { class: "card", style: "cursor:pointer", onclick: () => openChart(r.symbol, names.get(r.symbol) || r.symbol, r.stop_price) },
      h("div", { class: "row" },
        h("div", {}, h("span", { class: "sym" }, names.get(r.symbol) || r.symbol), " ", h("span", { class: "mut" }, r.symbol)),
        h("span", { class: "badge " + badgeClass(r.signal) }, r.signal + " · " + r.score)),
      h("div", { class: "row mut", style: "margin-top:4px" }, h("span", {}, "Kurs " + fmt(r.close)), h("span", {}, r.why || "")),
      h("div", { class: "grid" },
        h("div", {}, "Stop ca.", h("b", {}, fmt(r.stop_price))),
        h("div", {}, "Max. Position", h("b", {}, fmt(r.size_eur) + " €")),
        h("div", {}, "RSI", h("b", {}, fmt(r.rsi, 0))),
        h("div", {}, "12 Monate", h("b", { class: r.mom12 >= 0 ? "pos" : "neg" }, pct(r.mom12, 0))),
        h("div", {}, "Zum Hoch", h("b", {}, pct(r.dist_high, 0))),
        h("div", {}, "Schwankung", h("b", {}, fmt(r.vola * 100, 0) + " %")))));
  }
  return out;
}

async function tabPositionen() {
  const [{ data: hold, error }, sig, names] = await Promise.all([sb.from("holdings").select("*").order("symbol"), loadSignals(), loadNames()]);
  if (error) throw error;
  let value = 0, cost = 0;
  const cards = (hold || []).map((p) => {
    const s = sig.get(p.symbol);
    const price = s ? Number(s.close) : null;
    const v = price != null ? price * p.shares : null;
    if (v != null) { value += v; cost += p.shares * p.avg_price; }
    const chg = price != null ? price / p.avg_price - 1 : null;
    const stop = p.stop_price != null ? Number(p.stop_price) : p.avg_price * 0.85;
    const hit = price != null && price <= stop;
    return h("div", { class: "card" },
      h("div", { class: "row", style: "cursor:pointer", onclick: () => openChart(p.symbol, names.get(p.symbol) || p.symbol, p.stop_price != null ? p.stop_price : p.avg_price * 0.85) },
        h("div", {}, h("span", { class: "sym" }, names.get(p.symbol) || p.symbol), " ", h("span", { class: "mut" }, p.symbol + " · Verlauf ▸")),
        s ? h("span", { class: "badge " + badgeClass(s.signal) }, s.signal) : null),
      h("div", { class: "grid" },
        h("div", {}, "Stück", h("b", {}, fmt(p.shares, 4))),
        h("div", {}, "Einstand", h("b", {}, fmt(p.avg_price))),
        h("div", {}, "Kurs", h("b", {}, fmt(price))),
        h("div", {}, "Ergebnis", h("b", { class: chg == null ? "" : chg >= 0 ? "pos" : "neg" }, pct(chg))),
        h("div", {}, "Stop", h("b", { class: hit ? "neg" : "" }, fmt(stop) + (p.stop_price == null ? " (−15 %)" : ""))),
        h("div", {}, "Wert", h("b", {}, v != null ? fmt(v) + " €" : "–"))),
      p.note ? h("p", { class: "mut" }, p.note) : null,
      h("div", { style: "margin-top:8px;text-align:right" },
        h("button", { class: "sec del", onclick: async () => {
          if (!confirm("Position " + p.symbol + " entfernen?")) return;
          const { error: e } = await sb.from("holdings").delete().eq("symbol", p.symbol);
          if (e) toast("Fehler: " + e.message); else render();
        } }, "Entfernen")));
  });
  const sym = h("input", { list: "wl", placeholder: "z. B. SAP.DE", autocapitalize: "characters" });
  const dl = h("datalist", { id: "wl" }, [...names.keys()].map((k) => h("option", { value: k })));
  const sh = h("input", { type: "number", step: "any", inputmode: "decimal", placeholder: "z. B. 0,12" });
  const avg = h("input", { type: "number", step: "any", inputmode: "decimal", placeholder: "Kaufkurs je Stück" });
  const stp = h("input", { type: "number", step: "any", inputmode: "decimal", placeholder: "leer = 15 % unter Einstand" });
  const note = h("input", { placeholder: "Grund für den Kauf (empfohlen)" });
  const save = async () => {
    const symbol = sym.value.trim().toUpperCase();
    const shares = parseFloat(String(sh.value).replace(",", "."));
    const avgp = parseFloat(String(avg.value).replace(",", "."));
    if (!symbol || !(shares > 0) || !(avgp > 0)) return toast("Symbol, Stück und Kaufkurs ausfüllen");
    const stop = stp.value === "" ? null : parseFloat(String(stp.value).replace(",", "."));
    const { error: e } = await sb.from("holdings").upsert({ symbol, shares, avg_price: avgp, stop_price: stop, note: note.value.trim() || null });
    if (e) return toast("Fehler: " + e.message);
    // Symbol auch beobachten, damit es jeden Tag ausgewertet wird
    await sb.from("watchlist").upsert({ symbol, name: names.get(symbol) || symbol }, { onConflict: "symbol", ignoreDuplicates: true });
    toast("Gespeichert"); render();
  };
  return [
    h("div", { class: "card" }, h("div", { class: "row" }, h("span", { class: "mut" }, "Wert aller Positionen"), h("b", {}, fmt(value) + " €")),
      h("div", { class: "row" }, h("span", { class: "mut" }, "Ergebnis gesamt"), h("b", { class: value >= cost ? "pos" : "neg" }, cost ? pct(value / cost - 1) : "–"))),
    ...cards,
    !cards.length ? h("p", { class: "mut" }, "Noch keine Positionen. Trag hier ein, was du wirklich gekauft hast, dann bekommst du Stop- und Verkaufswarnungen.") : null,
    h("h2", {}, "Position eintragen"),
    h("div", { class: "card" }, h("label", {}, "Symbol"), sym, dl, h("label", {}, "Stück"), sh, h("label", {}, "Einstandskurs"), avg,
      h("label", {}, "Stop-Kurs (optional)"), stp, h("label", {}, "Notiz"), note, h("button", { class: "pri", onclick: save }, "Speichern")),
    h("p", { class: "mut" }, "Kurse und Beträge werden in der Notierungswährung der Börse gezeigt (bei .DE-Werten Euro)."),
  ];
}

async function tabWatchlist() {
  const { data, error } = await sb.from("watchlist").select("*").order("symbol");
  if (error) throw error;
  const sym = h("input", { placeholder: "Symbol, z. B. VOW3.DE", autocapitalize: "characters" });
  const nm = h("input", { placeholder: "Name (optional)" });
  const add = async () => {
    const symbol = sym.value.trim().toUpperCase();
    if (!symbol) return;
    const { error: e } = await sb.from("watchlist").upsert({ symbol, name: nm.value.trim() || symbol, active: true });
    if (e) return toast("Fehler: " + e.message);
    toast("Wird ausgewertet …");
    try {
      const r = await callScan([symbol]);
      if (r.errors && r.errors[symbol]) { await sb.from("watchlist").delete().eq("symbol", symbol); toast(symbol + ": " + r.errors[symbol]); }
      else toast(symbol + " hinzugefügt: " + r.results[symbol].signal + " (Score " + r.results[symbol].score + ")");
    } catch (x) { toast("Hinzugefügt, Auswertung beim nächsten Lauf (" + x.message + ")"); }
    render();
  };
  return [
    h("div", { class: "card" }, h("label", {}, "Neuer Wert"), sym, nm, h("button", { class: "pri", onclick: add }, "Hinzufügen")),
    h("p", { class: "mut" }, "Symbole wie bei Yahoo Finance: deutsche Werte mit .DE, Amsterdam .AS, Paris .PA. Neue Werte werden sofort ausgewertet, unbekannte Symbole werden abgelehnt."),
    ...(data || []).map((w) => h("div", { class: "card row" },
      h("div", {}, h("span", { class: "sym" }, w.name || w.symbol), " ", h("span", { class: "mut" }, w.symbol)),
      h("div", {},
        h("button", { class: "sec", onclick: async () => { await sb.from("watchlist").update({ active: !w.active }).eq("symbol", w.symbol); render(); } }, w.active ? "aktiv" : "pausiert"), " ",
        h("button", { class: "sec del", onclick: async () => { if (confirm(w.symbol + " entfernen?")) { await sb.from("watchlist").delete().eq("symbol", w.symbol); render(); } } }, "✕")))),
  ];
}

async function tabEinstellungen() {
  const { data: s, error } = await sb.from("settings").select("*").eq("id", 1).single();
  if (error) throw error;
  const mk = (label, key, step = "any") => { const i = h("input", { type: "number", step, inputmode: "decimal", value: s[key] }); i.dataset.key = key; return [h("label", {}, label), i]; };
  const f = [mk("Depotgröße (€)", "depot_eur"), mk("Risiko pro Trade (% vom Depot)", "risk_pct"), mk("Maximale Positionsgröße (% vom Depot)", "max_position_pct"), mk("Kandidat ab Score (1 bis 4)", "min_score_buy", "1")];
  const save = async () => {
    const upd = {};
    for (const [, inp] of f) upd[inp.dataset.key] = parseFloat(String(inp.value).replace(",", "."));
    const { error: e } = await sb.from("settings").update(upd).eq("id", 1);
    toast(e ? "Fehler: " + e.message : "Gespeichert, gilt ab dem nächsten Lauf");
  };
  return [
    h("div", { class: "card" }, f.flat(), h("button", { class: "pri", onclick: save }, "Speichern")),
    h("div", { class: "card" }, h("b", {}, "Wie der Score entsteht"),
      h("p", { class: "mut" }, "+1 Kurs über 200-Tage-Linie, +1 50-Tage- über 200-Tage-Linie, +1 positive Entwicklung über 12 Monate, +1 RSI zwischen 40 und 70. −1 bei RSI über 75, −1 bei mehr als 25 % unter dem 52-Wochen-Hoch. Kandidat ab dem eingestellten Score, meiden bei 0 oder weniger.")),
    h("div", { class: "card" }, h("button", { class: "sec", onclick: () => sb.auth.signOut() }, "Abmelden")),
  ];
}

async function tabVerlauf() {
  const { data, error } = await sb.from("alert_log").select("*").order("created_at", { ascending: false }).limit(50);
  if (error) throw error;
  if (!data.length) return [h("p", { class: "mut" }, "Noch keine Meldungen.")];
  return data.map((a) => h("div", { class: "card" }, h("div", { class: "mut" }, new Date(a.created_at).toLocaleString("de-DE")), h("div", {}, a.message)));
}

// ---------- Kursdiagramm ----------
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, String(v)); return e; }
function smaArr(x, n) { const out = new Array(x.length).fill(null); let sum = 0; for (let i = 0; i < x.length; i++) { sum += x[i]; if (i >= n) sum -= x[i - n]; if (i >= n - 1) out[i] = sum / n; } return out; }

async function openChart(symbol, name, stop) {
  const { data, error } = await sb.from("prices").select("d,close").eq("symbol", symbol).order("d", { ascending: true }).limit(1000);
  if (error) return toast("Fehler: " + error.message);
  if (!data || data.length < 20) return toast("Noch kein Kursverlauf. Er füllt sich beim nächsten Tageslauf.");
  const dates = data.map((r) => r.d), closes = data.map((r) => Number(r.close));
  const s50 = smaArr(closes, 50), s200 = smaArr(closes, 200);
  const W = 640, H = 280, ml = 8, mr = 54, mt = 10, mb = 22;
  let range = 252;
  const info = h("div", { class: "mut", style: "min-height:22px;margin:6px 0" });
  const svgHost = h("div");
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => e.key === "Escape" && close();
  document.addEventListener("keydown", onKey);
  const rangeBtns = h("div", { class: "chips", style: "margin:8px 0 4px" });

  function draw() {
    const n = Math.min(range, closes.length), off = closes.length - n;
    const c = closes.slice(off), a = s50.slice(off), b = s200.slice(off), d = dates.slice(off);
    const vals = [...c, ...a.filter((v) => v != null), ...b.filter((v) => v != null)];
    if (stop != null && stop > Math.min(...c) * 0.8) vals.push(Number(stop));
    let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
    const X = (i) => ml + (i / (n - 1)) * (W - ml - mr), Y = (v) => mt + (1 - (v - lo) / (hi - lo)) * (H - mt - mb);
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Kursverlauf " + symbol });
    for (let t = 0; t <= 4; t++) {
      const v = lo + ((hi - lo) * t) / 4, y = Y(v);
      svg.append(sv("line", { x1: ml, x2: W - mr, y1: y, y2: y, stroke: "#27313d", "stroke-width": 1 }));
      const tx = sv("text", { x: W - mr + 6, y: y + 4, fill: "#8a97a6", "font-size": 12 }); tx.textContent = fmt(v, v > 100 ? 0 : 1); svg.append(tx);
    }
    const line = (arr, color, w, dash) => {
      let dstr = "", started = false;
      arr.forEach((v, i) => { if (v == null) return; dstr += (started ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); started = true; });
      if (dstr) svg.append(sv("path", { d: dstr, fill: "none", stroke: color, "stroke-width": w, "stroke-linejoin": "round", ...(dash ? { "stroke-dasharray": dash } : {}) }));
    };
    line(b, "#8a97a6", 1.4); line(a, "#ffb020", 1.4); line(c, "#4da3ff", 2.2);
    if (stop != null && Number(stop) > lo && Number(stop) < hi) { const y = Y(Number(stop)); svg.append(sv("line", { x1: ml, x2: W - mr, y1: y, y2: y, stroke: "#ff5a5f", "stroke-width": 1.2, "stroke-dasharray": "5 4" })); }
    [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => {
      const t = sv("text", { x: X(i), y: H - 6, fill: "#8a97a6", "font-size": 12, "text-anchor": k === 0 ? "start" : k === 2 ? "end" : "middle" });
      t.textContent = new Date(d[i]).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }); svg.append(t);
    });
    const vl = sv("line", { y1: mt, y2: H - mb, stroke: "#8a97a6", "stroke-width": 1, visibility: "hidden" });
    const dot = sv("circle", { r: 4.5, fill: "#4da3ff", visibility: "hidden" });
    svg.append(vl, dot);
    const show = (ev) => {
      const r = svg.getBoundingClientRect();
      const x = ((ev.clientX - r.left) / r.width) * W;
      const i = Math.max(0, Math.min(n - 1, Math.round(((x - ml) / (W - ml - mr)) * (n - 1))));
      vl.setAttribute("x1", X(i)); vl.setAttribute("x2", X(i)); vl.setAttribute("visibility", "visible");
      dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(c[i])); dot.setAttribute("visibility", "visible");
      info.textContent = new Date(d[i]).toLocaleDateString("de-DE") + " · Kurs " + fmt(c[i]) + (a[i] != null ? " · 50T " + fmt(a[i]) : "") + (b[i] != null ? " · 200T " + fmt(b[i]) : "");
    };
    svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
    svgHost.replaceChildren(svg);
    info.textContent = "Letzter Kurs " + fmt(c[n - 1]) + " (" + new Date(d[n - 1]).toLocaleDateString("de-DE") + "). Wische über das Diagramm für einzelne Tage.";
    rangeBtns.replaceChildren(...[["3 Monate", 63], ["6 Monate", 126], ["12 Monate", 252], ["Alles", 1000]].map(([t, v]) =>
      h("button", { class: "chip" + (range === v ? " on" : ""), onclick: () => { range = v; draw(); } }, t)));
  }

  const overlay = h("div", { class: "modal", onclick: (e) => e.target === overlay && close() },
    h("div", { class: "box" },
      h("div", { class: "row" }, h("div", {}, h("span", { class: "sym" }, name), " ", h("span", { class: "mut" }, symbol)), h("button", { class: "sec", onclick: close }, "Schließen")),
      rangeBtns, info, svgHost,
      h("div", { class: "leg" },
        h("span", {}, h("i", { style: "background:#4da3ff" }), "Kurs"),
        h("span", {}, h("i", { style: "background:#ffb020" }), "50-Tage-Linie"),
        h("span", {}, h("i", { style: "background:#8a97a6" }), "200-Tage-Linie"),
        stop != null ? h("span", {}, h("i", { style: "background:#ff5a5f" }), "Stop") : null)));
  document.body.append(overlay);
  draw();
}

const TABS = [["signale", "Signale", tabSignale], ["positionen", "Positionen", tabPositionen], ["watchlist", "Watchlist", tabWatchlist], ["verlauf", "Verlauf", tabVerlauf], ["einstellungen", "Mehr", tabEinstellungen]];

async function render() {
  const cur = TABS.find((t) => t[0] === state.tab);
  const main = h("main", {}, h("p", { class: "mut" }, "Lädt …"));
  $app.replaceChildren(
    h("header", {}, h("h1", {}, cur[1])),
    main,
    h("nav", {}, TABS.map((t) => h("button", { class: state.tab === t[0] ? "on" : "", onclick: () => { state.tab = t[0]; render(); } }, t[1]))));
  try { main.replaceChildren(...(await cur[2]()).filter(Boolean)); }
  catch (e) { main.replaceChildren(h("p", { class: "neg" }, "Fehler: " + (e.message || e))); }
}

sb.auth.onAuthStateChange((_ev, session) => (session ? render() : renderLogin()));
sb.auth.getSession().then(({ data }) => (data.session ? render() : renderLogin()));
</script>
</body>
</html>
